<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email | Recommenu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="logo">
    <img src="img/Group 26086203.png" alt="Recommenu Logo" class="mb-3" />
  </div>

  <div class="verify-wrapper rounded-top-4 bg-white p-4">
    <h4 class="mb-2 text-center">Verify Your Email</h4>
    <p class="text-muted text-center mb-4">Please enter the 6 digit code sent to<br><strong>email@example.com</strong></p>

    <div class="d-flex justify-content-center gap-2 mb-3">
      <input type="text" maxlength="1" class="verify-input" />
      <input type="text" maxlength="1" class="verify-input" />
      <input type="text" maxlength="1" class="verify-input" />
      <input type="text" maxlength="1" class="verify-input" />
      <input type="text" maxlength="1" class="verify-input" />
      <input type="text" maxlength="1" class="verify-input" />
    </div>

    <p class="text-center text-muted">
      Didn’t receive the code?
      <a href="#" class="text-danger fw-semibold">Resend</a>
    </p>

    <div class="d-grid mt-3">
      <button class="btn btn-success rounded-pill">Verify</button>
    </div>

    <p class="text-center mt-3">
      <a href="#" class="text-danger">Change Email?</a>
    </p>
  </div>

</body>
</html>
