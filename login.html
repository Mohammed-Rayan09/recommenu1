<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Recommenu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="logo">
    <img src="img/Group 26086203.png" alt="Recommenu Logo" />
    <!-- <h1><span class="recom">RECOM</span><span class="menu">MENU</span></h1> -->
  </div>

  <div class="login-wrapper">
    <div class="login-container">
      <h4 class="mb-2">Log in</h4>
      <p class="mb-4 text-muted">Please enter your email and password or log in with social media</p>
      
      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="example@email.com" required />
        </div>

        <div class="mb-2">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="password" required />
        </div>

        <div class="mb-3 text-end">
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-login">Log in</button>
      </form>

      <hr/>

      <div class="social-icons">
        <a href="#" title="Login with Google">
          <img src="img/google.png" alt="Google" />
        </a>
        <a href="#" title="Login with Facebook">
          <img src="img/facebook.png" alt="Facebook" />
        </a>
        <a href="#" title="Login with Apple">
          <img src="img/apple.png" alt="Apple" />
        </a>
      </div>
      

      <div class="signup">
        <p>Don't have an account yet? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

</body>
</html>
