<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Recommenu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared Logo Section -->
  <div class="logo">
    <img src="img/Group 26086203.png" alt="Recommenu Logo" />
  </div>

  <div class="login-wrapper">
    <div class="login-container">
      <h4 class="mb-2">Sign up</h4>
      <p class="mb-4 text-muted">Please enter your email and password or sign up with social media</p>
      
      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="example@email.com" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="password" required />
        </div>

        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" placeholder="confirm password" required />
        </div>

        <button type="submit" class="btn btn-login">Sign up</button>
      </form>

      <hr/>

      <!-- Shared Social Icons Section -->
      <div class="social-icons">
        <a href="#" title="Sign up with Google">
          <img src="img/google.png" alt="Google" />
        </a>
        <a href="#" title="Sign up with Facebook">
          <img src="img/facebook.png" alt="Facebook" />
        </a>
        <a href="#" title="Sign up with Apple">
          <img src="img/apple.png" alt="Apple" />
        </a>
      </div>

      <!-- Shared Footer Text Section -->
      <div class="signup">
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

</body>
</html>
